<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASV Dashboard</title>
<link rel="stylesheet" href="/static/css/style.css">
<script src="https://cdn.jsdelivr.net/npm/socket.io@4.7.2/client-dist/socket.io.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
<div class="wrap">

  <!-- HEADER -->
  <header>
    <div class="logo">
      <div class="logo-ring"><div class="logo-dot"></div></div>
      <div>
        <div class="logo-name">ASV Monitor</div>
        <div class="logo-sub">Autonomous Surface Vehicle · Data Fusion</div>
      </div>
    </div>
    <div class="header-right">
      <div class="conn-badge">
        <div class="conn-dot" id="dot-mav"></div>
        <span>Pixhawk</span>
      </div>
      <div class="conn-badge">
        <div class="conn-dot" id="dot-ard"></div>
        <span>Arduino</span>
      </div>
      <span id="ts">--:--:--</span>
    </div>
  </header>

  <!-- GAUGES (6 params) -->
  <div class="gauges">
    <div class="gauge" style="--c: var(--lat-c)">
      <div class="gauge-lbl">Latitude</div>
      <div class="gauge-val" id="g-lat">--<span class="gauge-unit">°</span></div>
      <div class="gauge-bar-wrap"><div class="gauge-bar" id="b-lat" style="width:50%"></div></div>
    </div>
    <div class="gauge" style="--c: var(--lon-c)">
      <div class="gauge-lbl">Longitude</div>
      <div class="gauge-val" id="g-lon">--<span class="gauge-unit">°</span></div>
      <div class="gauge-bar-wrap"><div class="gauge-bar" id="b-lon" style="width:50%"></div></div>
    </div>
    <div class="gauge" style="--c: var(--depth-c)">
      <div class="gauge-lbl">Depth</div>
      <div class="gauge-val" id="g-depth">--<span class="gauge-unit">m</span></div>
      <div class="gauge-bar-wrap"><div class="gauge-bar" id="b-depth" style="width:0%"></div></div>
    </div>
    <div class="gauge" style="--c: var(--ph-c)">
      <div class="gauge-lbl">pH</div>
      <div class="gauge-val" id="g-ph">--<span class="gauge-unit"></span></div>
      <div class="gauge-bar-wrap"><div class="gauge-bar" id="b-ph" style="width:0%"></div></div>
    </div>
    <div class="gauge" style="--c: var(--do-c)">
      <div class="gauge-lbl">Dissolved O₂</div>
      <div class="gauge-val" id="g-do">--<span class="gauge-unit">mg/L</span></div>
      <div class="gauge-bar-wrap"><div class="gauge-bar" id="b-do" style="width:0%"></div></div>
    </div>
    <div class="gauge" style="--c: var(--temp-c)">
      <div class="gauge-lbl">Temperature</div>
      <div class="gauge-val" id="g-temp">--<span class="gauge-unit">°C</span></div>
      <div class="gauge-bar-wrap"><div class="gauge-bar" id="b-temp" style="width:0%"></div></div>
    </div>
  </div>

  <!-- CHARTS -->
  <div class="charts">
    <div class="chart-card" style="--c: var(--depth-c)">
      <div class="chart-hdr">
        <div class="chart-title">Depth</div>
        <div class="chart-cur" id="cur-depth">-- m</div>
      </div>
      <div class="chart-wrap"><canvas id="chart-depth"></canvas></div>
    </div>
    <div class="chart-card" style="--c: var(--ph-c)">
      <div class="chart-hdr">
        <div class="chart-title">pH</div>
        <div class="chart-cur" id="cur-ph">--</div>
      </div>
      <div class="chart-wrap"><canvas id="chart-ph"></canvas></div>
    </div>
    <div class="chart-card" style="--c: var(--do-c)">
      <div class="chart-hdr">
        <div class="chart-title">Dissolved O₂</div>
        <div class="chart-cur" id="cur-do">-- mg/L</div>
      </div>
      <div class="chart-wrap"><canvas id="chart-do"></canvas></div>
    </div>
  </div>

  <!-- BOTTOM: Mission + Log -->
  <div class="bottom">

    <!-- MISSION PANEL -->
    <div class="panel">
      <div class="panel-title">Mission Control</div>

      <div class="upload-zone" id="drop-zone">
        <input type="file" id="file-input" accept=".waypoints">
        <label for="file-input">
          วาง .waypoints ไฟล์ที่นี่ หรือ <span>คลิกเพื่อเลือก</span>
        </label>
      </div>

      <div class="mission-status" id="mission-msg">ยังไม่ได้ upload mission</div>

      <div class="btn-row">
        <button class="btn primary" id="btn-start" disabled onclick="startMission()">
          ARM + START
        </button>
        <button class="btn" onclick="window.location='/download/csv'">
          DOWNLOAD CSV
        </button>
      </div>
    </div>

    <!-- LOG PANEL -->
    <div class="panel">
      <div class="panel-title">System Log</div>
      <div class="log-body" id="log"></div>
    </div>

  </div>
</div>

<script src="/static/js/charts.js"></script>
<script>
// ---- gauge helpers ----
function setGauge(id, barId, value, decimals, min, max) {
  const el = document.getElementById(id);
  const unit = el.querySelector('.gauge-unit').outerHTML;
  el.innerHTML = parseFloat(value).toFixed(decimals) + unit;
  if (barId) {
    const pct = Math.min(100, Math.max(0, (value - min) / (max - min) * 100));
    document.getElementById(barId).style.width = pct + '%';
  }
}

function addLog(msg, cls = '') {
  const log = document.getElementById('log');
  const div = document.createElement('div');
  const ts = new Date().toTimeString().slice(0, 8);
  div.innerHTML = `<span class="ts">${ts}</span> <span class="${cls}">${msg}</span>`;
  log.prepend(div);
  while (log.children.length > 30) log.removeChild(log.lastChild);
}

// ---- SocketIO ----
const socket = io();

socket.on('connect',    () => addLog('WebSocket connected', 'ok'));
socket.on('disconnect', () => addLog('WebSocket disconnected', 'err'));

socket.on('sensor_update', (d) => {
  document.getElementById('ts').textContent = d.ts;

  document.getElementById('dot-mav').className = 'conn-dot ' + (d.mav_ok ? 'ok' : 'err');
  document.getElementById('dot-ard').className = 'conn-dot ' + (d.ard_ok ? 'ok' : 'err');

  setGauge('g-lat',   null,    d.lat,   6, -90,  90);
  setGauge('g-lon',   null,    d.lon,   6, -180, 180);
  setGauge('g-depth', 'b-depth', d.depth, 2, 0, 20);
  setGauge('g-ph',    'b-ph',   d.ph,   2, 0, 14);
  setGauge('g-do',    'b-do',   d.do,   2, 0, 14);
  setGauge('g-temp',  'b-temp', d.temp, 2, 20, 40);

  document.getElementById('cur-depth').textContent = d.depth.toFixed(2) + ' m';
  document.getElementById('cur-ph').textContent    = d.ph.toFixed(2);
  document.getElementById('cur-do').textContent    = d.do.toFixed(2) + ' mg/L';

  pushChartData(d.ts, d.depth, d.ph, d.do);
});

socket.on('mission_update', (d) => {
  const el  = document.getElementById('mission-msg');
  const cls = d.state === 'ready' ? 'ok' : d.state === 'error' ? 'err' : 'busy';
  el.className = 'mission-status ' + cls;
  el.textContent = d.message;
  document.getElementById('btn-start').disabled = (d.state !== 'ready');
  addLog(`Mission: ${d.message}`, cls);
});

// ---- File upload ----
document.getElementById('file-input').addEventListener('change', function() {
  if (!this.files[0]) return;
  uploadWaypoints(this.files[0]);
});

const dropZone = document.getElementById('drop-zone');
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.style.borderColor = 'var(--accent)'; });
dropZone.addEventListener('dragleave', () => { dropZone.style.borderColor = ''; });
dropZone.addEventListener('drop', e => {
  e.preventDefault(); dropZone.style.borderColor = '';
  const file = e.dataTransfer.files[0];
  if (file) uploadWaypoints(file);
});

function uploadWaypoints(file) {
  const fd = new FormData();
  fd.append('file', file);
  const msg = document.getElementById('mission-msg');
  msg.className = 'mission-status busy';
  msg.textContent = `กำลัง upload: ${file.name}...`;
  addLog(`Uploading ${file.name}`, 'inf');

  fetch('/api/mission/upload', { method: 'POST', body: fd })
    .then(r => r.json())
    .then(d => {
      if (d.ok) {
        addLog(`Parsed ${d.waypoints} waypoints`, 'ok');
      } else {
        msg.className = 'mission-status err';
        msg.textContent = d.error;
        addLog(d.error, 'err');
      }
    })
    .catch(e => addLog('Upload failed: ' + e, 'err'));
}

function startMission() {
  if (!confirm('ARM และ START mission? ตรวจสอบให้แน่ใจก่อนเริ่ม')) return;
  fetch('/api/mission/start', { method: 'POST' })
    .then(r => r.json())
    .then(d => addLog(d.ok ? 'Mission started!' : ('Start failed: ' + d.error), d.ok ? 'ok' : 'err'));
}

// ---- Init charts ----
document.addEventListener('DOMContentLoaded', initCharts);
</script>
</body>
</html>
